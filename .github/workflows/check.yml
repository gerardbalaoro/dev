name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - name: Test compiled API and CLI
        run: pnpm test tests/api.test.ts tests/cli.test.ts tests/lifecycle.test.ts
        env:
          DEV_TEST_API: dist/index.js
          DEV_TEST_CLI: dist/cli.js
