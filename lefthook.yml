pre-commit:
  parallel: false
  jobs:
    - name: format
      run: pnpm exec oxfmt --write --no-error-on-unmatched-pattern {staged_files}
      glob: "**/*.{js,jsx,mjs,cjs,ts,tsx,mts,cts,json,jsonc,json5,css,scss,less,html,vue,yaml,yml,md,mdx,graphql,gql,hbs,handlebars}"
      stage_fixed: true
    - name: lint
      run: pnpm exec oxlint --no-error-on-unmatched-pattern {staged_files}
      glob: "**/*.{js,jsx,mjs,cjs,ts,tsx,mts,cts,vue}"
